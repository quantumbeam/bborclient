[project]
name = "bbor_client"
version = "1.1.0"
description = "A python client library for the BBO-Rietveld API server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "suzukikensuke1", email = "kensuke_suzuki@ap.eng.osaka-u.ac.jp" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.3",
    "plotly>=6.8.0",
    "pydantic>=2.11.7",
    "pymongo>=4.15.5",
    "python-abc>=0.2.0",
    "requests>=2.32.4",
]

[project.optional-dependencies]
parsexml = [
    "xmltodict>=0.14.2",
]
GSAS-II = [
    "GSAS-II @ git+https://github.com/AdvancedPhotonSource/GSAS-II.git@main",
    "gitpython>=3.1.45",
    "numpy<2.0 ; python_version <= '3.11'",
    "numpy>=2.0 ; python_version > '3.11'",
    "pycifrw>=5.0.1",
    "scipy>=1.16.3",
]

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "ipykernel>=6.29.5",
    "pip-audit>=2.9.0",
    "pytest>=8.4.1",
    "python-semantic-release>=10.5.2",
    "ruff>=0.14.5",
]

# Building
[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

# Semantic release
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
other_allowed_tags = ["build", "chore", "ci", "docs", "style", "refactor", "test"]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "style", "refactor", "test"]
default_bump_level = 0
parse_squash_commits = true
ignore_merge_commits = false


